<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studyhub: Free Class 10 Mathematics and Science lessons, practice questions and revision.">
  <title>Studyhub | Class 10 Learning</title>

  <style>
    :root {
      --green: #176b55;
      --dark: #123d32;
      --light: #edf7f2;
      --white: #ffffff;
      --text: #20312b;
      --muted: #66766f;
      --border: #dce8e1;
      --orange: #f2a65a;
      --shadow: 0 8px 25px rgba(18, 61, 50, .08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7faf8;
      color: var(--text);
      line-height: 1.6;
    }

    button, input, select { font: inherit; }

    button { cursor: pointer; }

    a { color: var(--green); }

    .navbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 13px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      color: var(--green);
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand span { color: var(--orange); }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .nav-links button {
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 9px 11px;
      border-radius: 9px;
    }

    .nav-links button:hover,
    .nav-links button.active {
      background: var(--light);
      color: var(--green);
      font-weight: bold;
    }

    main {
      width: min(1120px, 92%);
      margin: 28px auto 55px;
      min-height: 65vh;
    }

    .page { display: none; }
    .page.active { display: block; }

    .hero {
      padding: 48px 35px;
      border-radius: 22px;
      background: linear-gradient(130deg, #e3f4e9, #f7f8e9);
      margin-bottom: 25px;
    }

    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h1 {
      color: var(--dark);
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
      margin: 12px 0;
    }

    h2, h3 { color: var(--dark); }

    .hero p {
      max-width: 680px;
      color: #52675d;
      font-size: 17px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      background: var(--green);
      color: white;
      font-weight: bold;
      display: inline-block;
      margin: 5px 4px 5px 0;
    }

    .btn:hover { background: var(--dark); }

    .btn.secondary {
      background: white;
      color: var(--green);
      border: 1px solid var(--border);
    }

    .btn.orange { background: #bd6d1a; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .card p { color: var(--muted); }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--light);
      font-size: 25px;
    }

    .pill {
      display: inline-block;
      border-radius: 30px;
      background: var(--light);
      color: var(--green);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .muted { color: var(--muted); }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 25px 0 15px;
    }

    .section-heading h2 { margin: 0; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .stat strong {
      display: block;
      font-size: 30px;
      color: var(--green);
    }

    .lesson-list {
      display: grid;
      gap: 12px;
    }

    .lesson {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 16px;
    }

    .lesson h3 { margin: 0 0 4px; }
    .lesson p { margin: 0; font-size: 14px; }

    .lesson-actions { flex-shrink: 0; }

    .progress-track {
      background: #e7eee9;
      height: 10px;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      background: var(--green);
      height: 100%;
      width: 0%;
      transition: width .25s;
    }

    .question {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 13px;
      margin: 14px 0;
      background: white;
    }

    .option {
      display: block;
      margin: 9px 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
    }

    .option:hover { background: var(--light); }

    .option input { margin-right: 8px; }

    input[type="text"], input[type="search"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd9d1;
      border-radius: 9px;
      background: white;
      margin: 6px 0 12px
